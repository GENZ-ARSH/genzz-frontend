        #chatbot-container {

    </style>
    <script>
        const BASE_API_URL = 'https://genzz-backend.onrender.com';
        const clickSound = new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA');
        clickSound.volume = 0.3;

        // Error troubleshooting database
        const errors = {
            'cover image upload nahi hua': {
                reason: 'Image upload failed due to invalid file format, size limit exceeded, or server error.',
                solution: 'Ensure the file is JPG/PNG, under 5MB, and check your internet connection. Try again or contact support on Telegram: https://t.me/genzcoders1'
            },
            'book add nahi hui': {
                reason: 'Book addition failed due to missing fields, invalid PDF link, or server error.',
                solution: 'Fill all required fields (title, author, PDF link, class, exam). Ensure PDF link is a valid Google Drive URL. Try again or contact support.'
            },
            'server error': {
                reason: 'Server is down, overloaded, or there’s a network issue.',
                solution: 'Wait a few minutes and retry. Check your internet connection. If the issue persists, contact support on Telegram.'
            },
            'invalid csrf token': {
                reason: 'CSRF token is missing or invalid, possibly due to session timeout or network interruption.',
                solution: 'Log out and log in again via home.html chatbot using /admin. Clear browser cache if the issue continues.'
            },
            'books load nahi hui': {
                reason: 'Failed to fetch books due to server error or network issue.',
                solution: 'Check your internet connection and refresh the page. If the issue persists, contact support on Telegram.'
            },
            'failed to add book': {
                reason: 'Server rejected the book addition due to validation errors or database issue.',
                solution: 'Check all fields for correct data (e.g., valid URL for PDF). Ensure server is running and try again.'
            }
        };

        function sanitizeInput(input) {
            const div = document.createElement('div');
            div.textContent = input;
            return div.innerHTML;
        }

        async function getCsrfToken() {
            try {
                const response = await fetch(`${BASE_API_URL}/api/csrf-token`, {
                    method: 'GET',
                    credentials: 'include'
                });
                const data = await response.json();
                return data.csrfToken;
            } catch (error) {
                console.error('Error fetching CSRF token:', error);
                return null;
            }
        }

        async function checkAdminAccess() {
            if (localStorage.getItem('isAdmin') !== 'true') {
                Swal.fire({
                    title: 'Access Denied!',
                    text: 'Bhai, admin login kar pehle!',
                    icon: 'error',
                    confirmButtonText: 'Back to Home'
                }).then(() => {
                    window.location.href = './home.html';
                });
                return false;
            }

            try {
                const csrfToken = await getCsrfToken();
                if (!csrfToken) {
                    throw new Error('CSRF token fetch failed');
                }
                const response = await fetch(`${BASE_API_URL}/api/validate-admin`, {
                    method: 'GET',
                    headers: { 'X-CSRF-Token': csrfToken },
                    credentials: 'include'
                });
                const result = await response.json();
                if (!result.success) {
                    throw new Error(result.error || 'Admin validation failed');
                }
                return true;
            } catch (error) {
                console.error('Admin validation error:', error);
                Swal.fire({
                    title: 'Access Denied!',
                    text: 'Bhai, admin session expire ho gaya ya invalid hai!',
                    icon: 'error',
                    confirmButtonText: 'Back to Home'
                }).then(() => {
                    localStorage.removeItem('isAdmin');
                    window.location.href = './home.html';
                });
                return false;
            }
        }

        async function loadBooks() {
            try {
                const response = await fetch(`${BASE_API_URL}/api/books`);
                const books = await response.json();
                const booksList = document.querySelector('.books-list');
                booksList.innerHTML = '';
                books.forEach(book => {
                    const item = document.createElement('div');
                    item.className = 'book-item';
                    item.innerHTML = `
                        <img src="${book.image_url}" alt="${book.title}">
                        <div>
                            <h5>${book.title}</h5>
                            <p>Author: ${book.author}</p>
                            <p>Class: ${book.class} | Exam: ${book.exam}</p>
                            <button class="btn-delete" data-id="${book.id}">Delete</button>
                        </div>
                    `;
                    booksList.appendChild(item);
                });

                // Add delete button listeners
                document.querySelectorAll('.btn-delete').forEach(button => {
                    button.addEventListener('click', async () => {
                        clickSound.play();
                        const bookId = button.dataset.id;
                        const csrfToken = await getCsrfToken();
                        if (!csrfToken) {
                            Swal.fire('Error!', 'Security issue, bhai! Try again.', 'error');
                            return;
                        }
                        try {
                            const response = await fetch(`${BASE_API_URL}/api/books/${bookId}`, {
                                method: 'DELETE',
                                headers: { 'X-CSRF-Token': csrfToken },
                                credentials: 'include'
                            });
                            if (response.ok) {
                                Swal.fire('Success!', 'Book delete ho gayi!', 'success');
                                loadBooks();
                            } else {
                                const result = await response.json();
                                Swal.fire('Error!', result.error || 'Book delete nahi hui, bhai!', 'error');
                            }
                        } catch (error) {
                            console.error('Delete book error:', error);
                            Swal.fire('Error!', 'Server error, bhai! Baad mein try kar.', 'error');
                        }
                    });
                });
            } catch (error) {
                console.error('Error loading books:', error);
                Swal.fire('Error!', 'Books load nahi hui, bhai!', 'error');
            }
        }

        function addChatbotMessage(message, isBot = false) {
            const messages = document.getElementById('chatbot-messages');
            const div = document.createElement('div');
            div.className = `chatbot-message ${isBot ? 'bot' : 'user'}`;
            div.innerHTML = sanitizeInput(message);
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        async function handleChatbotInput() {
            const input = document.getElementById('chatbot-input-text');
            const message = input.value.trim();
            if (!message) return;

            addChatbotMessage(message);
            input.value = '';

            if (message.toLowerCase() === '/manage') {
                addChatbotMessage(`
                    📚 **Admin Management Guide** 📚
                    1. **Books Upload Karne Ka Tareeka**:
                       - "Add New Book" form mein details bharo:
                         - Title: Book ka naam.
                         - Author: Lekhak ka naam.
                         - Cover Image: JPG/PNG file (optional).
                         - PDF Link: Google Drive ka shareable link.
                         - Class: All, 10th, 11th, 12th mein se chuno.
                         - Exam: All, Board, JEE, NEET mein se chuno.
                       - "Add Book" button pe click karo.
                       - Success message aayega agar book add hui.
                    2. **Website Ke Features**:
                       - **Book List**: Home page pe books ka grid, search bar se filter karo.
                       - **Dark Mode**: Top right toggle se switch karo.
                       - **Chatbot**: Home pe /admin se login, yahan queries bhejo.
                       - **Admin Panel**: Books add/delete karo, list dekho.
                       - **Key Validation**: Users ke liye access key chahiye.
                    3. **Tips**:
                       - PDF link shareable hona chahiye (Google Drive se "Anyone with link").
                       - Image size chhota rakho (<5MB) for faster upload.
                       - Issue ho toh Telegram pe ping karo: https://t.me/genzcoders1
                `, true);
                return;
            }

            if (message.toLowerCase() === '/help') {
                addChatbotMessage(`
                    🆘 **Admin Chatbot Help** 🆘
                    Available Commands:
                    - **/manage**: Books upload aur website features ki info.
                    - **/troubleshoot <error>**: Error ka reason aur solution (e.g., /troubleshoot book add nahi hui).
                    - **/help**: Yeh help message.
                    Other Queries:
                    - Naam set karo: "Name: TeraNaam"
                    - Query ya feedback bhejo, team ko forward hoga.
                `, true);
                return;
            }

            if (message.toLowerCase().startsWith('/troubleshoot')) {
                const query = message.slice(13).trim().toLowerCase();
                if (!query) {
                    addChatbotMessage('Bhai, error message ya keyword daal (e.g., /troubleshoot book add nahi hui)', true);
                    return;
                }

                let found = false;
                for (const [error, { reason, solution }] of Object.entries(errors)) {
                    if (error.includes(query) || query.includes(error)) {
                        addChatbotMessage(`
                            ⚠️ **Error: ${error}** ⚠️
                            **Reason**: ${reason}
                            **Solution**: ${solution}
                        `, true);
                        found = true;
                        break;
                    }
                }

                if (!found) {
                    addChatbotMessage(`
                        😕 **Error Nahi Mila** 😕
                        Tera error database mein nahi hai. Exact error message daal ke try kar.
                        Ya Telegram pe team se baat kar: https://t.me/genzcoders1
                    `, true);
                }
                return;
            }

            const nameMatch = message.match(/^Name:\s*(.+)$/i);
            if (nameMatch) {
                localStorage.setItem('chatbotName', nameMatch[1]);
                addChatbotMessage('Naam save ho gaya! Ab query ya feedback daal, bhai.', true);
                return;
            }

            const name = localStorage.getItem('chatbotName') || 'Anonymous';
            try {
                const csrfToken = await getCsrfToken();
                if (!csrfToken) {
                    addChatbotMessage('Security issue, bhai! Try again ya Telegram pe contact kar.', true);
                    return;
                }
                const response = await fetch(`${BASE_API_URL}/api/reviews`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': csrfToken
                    },
                    body: JSON.stringify({ name, message, _csrf: csrfToken }),
                    credentials: 'include'
                });
                const result = await response.json();
                if (result.success) {
                    addChatbotMessage('Query bhej di, bhai! Team jaldi reply karegi. 😊', true);
                } else {
                    addChatbotMessage(`Query bhejne mein error: ${result.error || 'Kuch toh gadbad hai'}. Fir se try kar!`, true);
                }
            } catch (error) {
                console.error('Error submitting query:', error);
                addChatbotMessage('Server error, bhai. Thodi der baad try kar ya Telegram pe chill kar! 😎', true);
            }
        }

        document.addEventListener('DOMContentLoaded', async function () {
            if (!(await checkAdminAccess())) return;

            const darkModeEnabled = localStorage.getItem('darkMode') === 'enabled';
            if (darkModeEnabled) {
                document.body.classList.add('dark-mode');
                document.getElementById('darkModeToggle').checked = true;
            }
            document.getElementById('darkModeToggle').addEventListener('change', function () {
                clickSound.play();
                if (this.checked) {
                    document.body.classList.add('dark-mode');
                    localStorage.setItem('darkMode', 'enabled');
                } else {
                    document.body.classList.remove('dark-mode');
                    localStorage.setItem('darkMode', 'disabled');
                }
            });

            loadBooks();

            const coverInput = document.getElementById('cover');
            const coverPreview = document.getElementById('cover-preview');
            coverInput.addEventListener('change', function () {
                const file = this.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        coverPreview.src = e.target.result;
                        coverPreview.style.display = 'block';
                    };
                    reader.readAsDataURL(file);
                } else {
                    coverPreview.style.display = 'none';
                }
            });

            document.getElementById('book-form').addEventListener('submit', async function (e) {
                e.preventDefault();
                clickSound.play();

                const title = document.getElementById('title').value;
                const author = document.getElementById('author').value;
                const cover = document.getElementById('cover').files[0];
                const pdfLink = document.getElementById('pdfLink').value;
                const classType = document.getElementById('class').value;
                const exam = document.getElementById('exam').value;

                if (!title || !author || !pdfLink || !classType || !exam) {
                    Swal.fire('Error!', 'Bhai, sab fields bhar de!', 'error');
                    return;
                }

                const csrfToken = await getCsrfToken();
                if (!csrfToken) {
                    Swal.fire('Error!', 'Security issue, bhai! Try again.', 'error');
                    return;
                }

                let image_url = '';
                if (cover) {
                    const formData = new FormData();
                    formData.append('source', cover);
                    formData.append('key', 'your_freeimage_api_key'); // Replace with actual FREEIMAGE_API_KEY
                    try {
                        const uploadResponse = await fetch('https://freeimage.host/api/1/upload', {
                            method: 'POST',
                            body: formData
                        });
                        const uploadResult = await uploadResponse.json();
                        if (!uploadResult.image || !uploadResult.image.url) {
                            throw new Error(uploadResult.error || 'Image upload failed');
                        }
                        image_url = uploadResult.image.url;
                    } catch (error) {
                        console.error('Image upload error:', error);
                        Swal.fire('Error!', 'Cover image upload nahi hua, bhai! Try again.', 'error');
                        return;
                    }
                }

                try {
                    const response = await fetch(`${BASE_API_URL}/api/books`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRF-Token': csrfToken
                        },
                        body: JSON.stringify({ title, author, link: pdfLink, image_url, class: classType, exam, _csrf: csrfToken }),
                        credentials: 'include'
                    });
                    const result = await response.json();
                    if (result.success) {
                        Swal.fire('Success!', 'Book add ho gayi, bhai! 😎', 'success');
                        document.getElementById('book-form').reset();
                        coverPreview.style.display = 'none';
                        loadBooks();
                    } else {
                        Swal.fire('Error!', result.error || 'Book add nahi hui, bhai!', 'error');
                    }
                } catch (error) {
                    console.error('Book add error:', error);
                    Swal.fire('Error!', 'Server error, bhai! Baad mein try kar.', 'error');
                }
            });

            document.getElementById('logout').addEventListener('click', async function () {
                clickSound.play();
                try {
                    const csrfToken = await getCsrfToken();
                    if (csrfToken) {
                        await fetch(`${BASE_API_URL}/api/logout`, {
                            method: 'POST',
                            headers: { 'X-CSRF-Token': csrfToken },
                            credentials: 'include'
                        });
                    }
                } catch (error) {
                    console.error('Logout error:', error);
                }
                localStorage.removeItem('isAdmin');
                Swal.fire({
                    title: 'Logged Out!',
                    text: 'Bhai, tu ab admin nahi hai!',
                    icon: 'info',
                    timer: 2000,
                    showConfirmButton: false
                }).then(() => {
                    window.location.href = './home.html';
                });
            });

            document.getElementById('chatbot-button').addEventListener('click', function () {
                clickSound.play();
                const window = document.getElementById('chatbot-window');
                window.style.display = window.style.display === 'flex' ? 'none' : 'flex';
                if (window.style.display === 'flex') {
                    addChatbotMessage('Welcome, bhai! /manage se books upload aur website info le, /troubleshoot se error fix kar, ya /help type kar.', true);
                }
            });
            document.getElementById('chatbot-input-text').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    clickSound.play();
                    handleChatbotInput();
                }
            });
            document.getElementById('chatbot-input-button').addEventListener('click', function () {
                clickSound.play();
                handleChatbotInput();
            });

            document.querySelectorAll('.btn-submit, .btn-logout, .btn-access').forEach(button => {
                button.addEventListener('click', function (e) {
                    clickSound.play();
                    const rect = e.target.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    tsParticles.load('sparkles-' + Date.now(), {
                        fullScreen: { enable: false },
                        particles: {
                            number: { value: 20 },
                            color: { value: ['#facc15', '#f97316'] },
                            shape: { type: 'star' },
                            opacity: { value: 0.8, animation: { enable: true, minimumValue: 0, speed: 2 } },
                            size: { value: 5, random: true },
                            move: {
                                enable: true,
                                speed: 10,
                                direction: 'none',
                                outModes: { default: 'destroy' }
                            }
                        },
                        emitters: {
                            position: { x, y },
                            rate: { quantity: 20, delay: 0 }
                        }
                    });
                });
            });

            document.querySelectorAll('.footer-links a').forEach(link => {
                link.addEventListener('click', () => clickSound.play());
            });
        });
    </script>
</head>

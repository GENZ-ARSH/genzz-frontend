    <style>
        body {
            margin: 0;
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #bfdbfe, #60a5fa);
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow-x: hidden;
        }
        #background-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            opacity: 0.4;
        }
        .header-section {
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
        }
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 1rem;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo-container img {
            width: 160px;
            height: 60px;
        }
        .flex-space-x-4 {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        main {
            flex-grow: 1;
            padding: 1.25rem 0;
        }
        .admin-section {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 1rem;
        }
        h2 {
            font-size: 1.5rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 1rem;
            font-family: 'Poppins', sans-serif;
            color: #1e40af;
        }
        .admin-form {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .admin-form:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: #1e40af;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            background: #fff;
            transition: border-color 0.3s ease;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.3);
        }
        #cover-preview {
            max-width: 150px;
            height: auto;
            border-radius: 8px;
            margin-top: 0.5rem;
            display: none;
        }
        .btn-submit, .btn-logout {
            display: inline-block;
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            padding: 0.75rem 2rem;
            background: linear-gradient(90deg, #3b82f6, #2563eb);
            color: #fff;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
            border: none;
            cursor: pointer;
        }
        .btn-submit:hover, .btn-logout:hover {
            transform: scale(1.05);
            background: linear-gradient(90deg, #2563eb, #1e40af);
        }
        .books-list {
            margin-top: 2rem;
        }
        .book-item {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 1rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .book-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }
        .book-item img {
            width: 80px;
            height: auto;
            border-radius: 8px;
        }
        .book-item div {
            flex-grow: 1;
        }
        .book-item h5 {
            font-size: 1.125rem;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            color: #1e40af;
        }
        .book-item p {
            margin: 0.25rem 0;
            color: #4b5563;
        }
        .relative { position: relative; }
        .inline-flex { display: inline-flex; align-items: center; cursor: pointer; }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }
        .rounded-full { border-radius: 9999px; }
        .peer:checked ~ .bg-blue-600 { background-color: #2563eb; }
        .transition-colors { transition: background-color 0.2s ease; }
        .w-11 { width: 2.75rem; }
        .h-6 { height: 1.5rem; }
        .bg-gray-200 { background-color: #e5e7eb; }
        .absolute { position: absolute; }
        .left-1 { left: 0.25rem; }
        .top-1 { top: 0.25rem; }
        .w-4 { width: 1rem; }
        .h-4 { height: 1rem; }
        .bg-white { background-color: #ffffff; }
        .transition-transform { transition: transform 0.2s ease; }
        .peer:checked ~ .translate-x-5 { transform: translateX(1.25rem); }
        .text-xs { font-size: 0.75rem; }
        .peer-checked\:hidden { display: none; }
        .peer-checked\:block { display: block; }
        .dark-mode {
            background: linear-gradient(135deg, #1e3a8a, #1e40af);
            color: #ffffff;
        }
        .dark-mode .admin-form, .dark-mode .book-item {
            background: rgba(30, 30, 30, 0.95);
            color: #ffffff;
        }
        .dark-mode .header-section {
            background: rgba(30, 30, 30, 0.1);
        }
        .dark-mode .book-item h5, .dark-mode .form-group label {
            color: #60a5fa;
        }
        footer {
            padding: 1rem;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            text-align: center;
            font-family: 'Poppins', sans-serif;
            color: #fff;
        }
        .dark-mode footer {
            background: linear-gradient(135deg, #2563eb, #1e40af);
        }
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1rem;
        }
        .footer-links a {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        .footer-links a:hover {
            color: #bfdbfe;
        }
    </style>
    <script>
        const BASE_API_URL = 'https://genzz-backend.onrender.com';
        const clickSound = new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA');
        clickSound.volume = 0.3;

        function sanitizeInput(input) {
            const div = document.createElement('div');
            div.textContent = input;
            return div.innerHTML;
        }

        async function checkAdminAccess() {
            if (localStorage.getItem('isAdmin') !== 'true') {
                Swal.fire({
                    title: 'Access Denied!',
                    text: 'Bhai, admin login kar pehle!',
                    icon: 'error',
                    confirmButtonText: 'Back to Home'
                }).then(() => {
                    window.location.href = './home.html';
                });
                return false;
            }
            return true;
        }

        async function loadBooks() {
            try {
                const response = await fetch(`${BASE_API_URL}/api/books`);
                const books = await response.json();
                const booksList = document.querySelector('.books-list');
                booksList.innerHTML = '';
                books.forEach(book => {
                    const item = document.createElement('div');
                    item.className = 'book-item';
                    item.innerHTML = `
                        <img src="${book.coverUrl}" alt="${book.title}">
                        <div>
                            <h5>${book.title}</h5>
                            <p>Author: ${book.author}</p>
                            <p>Class: ${book.class} | Exam: ${book.exam}</p>
                        </div>
                    `;
                    booksList.appendChild(item);
                });
            } catch (error) {
                console.error('Error loading books:', error);
                Swal.fire('Error!', 'Books load nahi hui, bhai!', 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', async function () {
            if (!(await checkAdminAccess())) return;

            const darkModeEnabled = localStorage.getItem('darkMode') === 'enabled';
            if (darkModeEnabled) {
                document.body.classList.add('dark-mode');
                document.getElementById('darkModeToggle').checked = true;
            }
            document.getElementById('darkModeToggle').addEventListener('change', function () {
                clickSound.play();
                if (this.checked) {
                    document.body.classList.add('dark-mode');
                    localStorage.setItem('darkMode', 'enabled');
                } else {
                    document.body.classList.remove('dark-mode');
                    localStorage.setItem('darkMode', 'disabled');
                }
            });

            loadBooks();

            const coverInput = document.getElementById('cover');
            const coverPreview = document.getElementById('cover-preview');
            coverInput.addEventListener('change', function () {
                const file = this.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        coverPreview.src = e.target.result;
                        coverPreview.style.display = 'block';
                    };
                    reader.readAsDataURL(file);
                } else {
                    coverPreview.style.display = 'none';
                }
            });

            document.getElementById('book-form').addEventListener('submit', async function (e) {
                e.preventDefault();
                clickSound.play();

                const title = document.getElementById('title').value;
                const author = document.getElementById('author').value;
                const cover = document.getElementById('cover').files[0];
                const pdfLink = document.getElementById('pdfLink').value;
                const classType = document.getElementById('class').value;
                const exam = document.getElementById('exam').value;

                if (!title || !author || !pdfLink || !classType || !exam) {
                    Swal.fire('Error!', 'Bhai, sab fields bhar de!', 'error');
                    return;
                }

                let coverUrl = '';
                if (cover) {
                    const formData = new FormData();
                    formData.append('cover', cover);
                    try {
                        const uploadResponse = await fetch(`${BASE_API_URL}/api/upload-cover`, {
                            method: 'POST',
                            body: formData
                        });
                        const uploadResult = await uploadResponse.json();
                        if (!uploadResult.success) {
                            throw new Error(uploadResult.error);
                        }
                        coverUrl = uploadResult.coverUrl;
                    } catch (error) {
                        console.error('Image upload error:', error);
                        Swal.fire('Error!', 'Cover image upload nahi hua, bhai!', 'error');
                        return;
                    }
                }

                try {
                    const response = await fetch(`${BASE_API_URL}/api/books`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title, author, coverUrl, pdfLink, class: classType, exam })
                    });
                    const result = await response.json();
                    if (result.success) {
                        Swal.fire('Success!', 'Book add ho gayi, bhai! 😎', 'success');
                        document.getElementById('book-form').reset();
                        coverPreview.style.display = 'none';
                        loadBooks();
                    } else {
                        Swal.fire('Error!', result.error || 'Book add nahi hui, bhai!', 'error');
                    }
                } catch (error) {
                    console.error('Book add error:', error);
                    Swal.fire('Error!', 'Server error, bhai! Baad mein try kar.', 'error');
                }
            });

            document.getElementById('logout').addEventListener('click', function () {
                clickSound.play();
                localStorage.removeItem('isAdmin');
                Swal.fire({
                    title: 'Logged Out!',
                    text: 'Bhai, tu ab admin nahi hai!',
                    icon: 'info',
                    timer: 2000,
                    showConfirmButton: false
                }).then(() => {
                    window.location.href = './home.html';
                });
            });

            document.querySelectorAll('.btn-submit, .btn-logout').forEach(button => {
                button.addEventListener('click', function (e) {
                    clickSound.play();
                    const rect = e.target.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    tsParticles.load('sparkles-' + Date.now(), {
                        fullScreen: { enable: false },
                        particles: {
                            number: { value: 20 },
                            color: { value: ['#3b82f6', '#2563eb'] },
                            shape: { type: 'star' },
                            opacity: { value: 0.8, animation: { enable: true, minimumValue: 0, speed: 2 } },
                            size: { value: 5, random: true },
                            move: {
                                enable: true,
                                speed: 10,
                                direction: 'none',
                                outModes: { default: 'destroy' }
                            }
                        },
                        emitters: {
                            position: { x, y },
                            rate: { quantity: 20, delay: 0 }
                        }
                    });
                });
            });

            document.querySelectorAll('.footer-links a').forEach(link => {
                link.addEventListener('click', () => clickSound.play());
            });
        });
    </script>
</head>
<body>
    <video id="background-video" autoplay loop muted playsinline>
        <source src="https://static.vecteezy.com/system/resources/previews/024/670/480/mp4/abstract-bright-blue-dna-molecular-structure-animated-background-motion-graphic-design-medical-clip-ultra-hd-4k-3840x2160-free-video.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <header class="header-section">
        <div class="container">
            <nav>
                <div class="logo-container">
                    <img src="./assets/logo.png" alt="GenZZ Library Logo">
                </div>
                <div class="flex-space-x-4">
                    <button id="logout" class="btn-logout">Logout</button>
                    <label class="relative inline-flex">
                        <input type="checkbox" id="darkModeToggle" class="sr-only peer">
                        <div class="w-11 h-6 bg-gray-200 rounded-full peer transition-colors">
                            <span class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-transform peer-checked:translate-x-5 flex items-center justify-center text-xs">
                                <i id="lightIcon" class="bi bi-brightness-high peer-checked:hidden"></i>
                                <i id="darkIcon" class="bi bi-moon-stars-fill hidden peer-checked:block"></i>
                            </span>
                        </div>
                    </label>
                </div>
            </nav>
        </div>
    </header>
    <main>
        <section class="admin-section">
            <h2>Admin Panel 📚</h2>
            <div class="admin-form">
                <h3>Add New Book</h3>
                <form id="book-form">
                    <div class="form-group">
                        <label for="title">Book Title</label>
                        <input type="text" id="title" required>
                    </div>
                    <div class="form-group">
                        <label for="author">Author</label>
                        <input type="text" id="author" required>
                    </div>
                    <div class="form-group">
                        <label for="cover">Cover Image (jpg, jpeg, png)</label>
                        <input type="file" id="cover" accept="image/jpeg,image/png">
                        <img id="cover-preview" alt="Cover Preview">
                    </div>
                    <div class="form-group">
                        <label for="pdfLink">PDF Link (Google Drive)</label>
                        <input type="url" id="pdfLink" required>
                    </div>
                    <div class="form-group">
                        <label for="class">Class</label>
                        <select id="class" required>
                            <option value="">Select Class</option>
                            <option value="all">All</option>
                            <option value="11th">11th</option>
                            <option value="12th">12th</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="exam">Exam</label>
                        <select id="exam" required>
                            <option value="">Select Exam</option>
                            <option value="all">All</option>
                            <option value="JEE">JEE</option>
                            <option value="NEET">NEET</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-submit">Add Book</button>
                </form>
            </div>
            <div class="books-list">
                <h3>Existing Books</h3>
                <!-- Books will be dynamically loaded here -->
            </div>
        </section>
    </main>
    <footer>
        <div class="footer-links">
            <a href="https://t.me/genzcoders1" target="_blank" rel="noopener noreferrer">Join Telegram</a>
            <a href="https://github.com/genzz-library" target="_blank" rel="noopener noreferrer">GitHub</a>
            <a href="mailto:support@genzzlibrary.com">Contact Us</a>
        </div>
        <p>Made with ❤️ by GenZZ-Coders | Video by Vecteezy</p>
    </footer>
</body>

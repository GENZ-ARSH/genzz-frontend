<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenZZ Library - Admin Panel</title>
    <link rel="icon" href="./assets/favicon.ico">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #bfdbfe, #60a5fa);
            font-family: 'Inter', sans-serif;
        }
        .admin-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 25px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }
        .admin-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.25);
        }
        .btn-access {
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            padding: 0.9rem 2.8rem;
            background: linear-gradient(90deg, #facc15, #f97316);
            color: #1e40af;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3);
        }
        .btn-access:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 20px rgba(249, 115, 22, 0.5);
            background: linear-gradient(90deg, #eab308, #ea580c);
        }
        .btn-access::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.5s ease, height 0.5s ease;
        }
        .btn-access:hover::before {
            width: 350px;
            height: 350px;
        }
        .dark-mode {
            background: linear-gradient(135deg, #1e3a8a, #1e40af);
            color: #ffffff;
        }
        .dark-mode .admin-card {
            background: rgba(30, 30, 30, 0.98);
            color: #ffffff;
        }
        .dark-mode .header-section {
            background: rgba(30, 30, 30, 0.95);
        }
        .dark-mode .footer-section {
            background: rgba(255, 255, 255, 0.05);
        }
        .made-with-heart {
            font-family: 'Poppins', sans-serif;
            color: #1e40af;
            transition: color 0.3s ease;
        }
        .dark-mode .made-with-heart {
            color: #f97316;
        }
        .made-with-heart:hover {
            color: #f97316;
        }
    </style>
    <script>
        const BASE_API_URL = 'https://genzz-backend.onrender.com';

        document.addEventListener('DOMContentLoaded', async function () {
            // Apply dark mode
            const darkModeEnabled = localStorage.getItem('darkMode') === 'enabled';
            if (darkModeEnabled) {
                document.body.classList.add('dark-mode');
                document.getElementById('darkModeToggle').checked = true;
            }
            document.getElementById('darkModeToggle').addEventListener('change', function () {
                try {
                    if (this.checked) {
                        document.body.classList.add('dark-mode');
                        localStorage.setItem('darkMode', 'enabled');
                    } else {
                        document.body.classList.remove('dark-mode');
                        localStorage.setItem('darkMode', 'disabled');
                    }
                } catch (error) {
                    console.error('Dark mode error:', error);
                    Swal.fire('Error!', 'Failed to toggle dark mode.', 'error');
                }
            });

            // Check admin login
            if (localStorage.getItem('isAdmin') !== 'true') {
                Swal.fire({
                    title: 'Access Denied',
                    text: 'Admin login required!',
                    icon: 'error',
                    confirmButtonText: 'Go to Login',
                }).then(() => {
                    window.location.href = './index.html';
                });
                return;
            }

            // Fetch books
            await fetchBooks();

            // Handle book form submission
            document.getElementById('book-form').addEventListener('submit', async function (e) {
                e.preventDefault();
                const title = document.getElementById('book-title').value;
                const author = document.getElementById('book-author').value;
                const link = document.getElementById('book-link').value;
                const image_url = document.getElementById('book-image').value;
                const book_class = document.getElementById('book-class').value;
                const exam = document.getElementById('book-exam').value;
                try {
                    const response = await fetch(`${BASE_API_URL}/api/books`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title, author, link, image_url, class: book_class, exam })
                    });
                    const result = await response.json();
                    if (result.success) {
                        Swal.fire('Success!', 'Book added!', 'success');
                        document.getElementById('book-form').reset();
                        await fetchBooks();
                    } else {
                        throw new Error(result.error || 'Failed to add book');
                    }
                } catch (error) {
                    console.error('Error adding book:', error);
                    Swal.fire('Error!', 'Failed to add book. Please try again.', 'error');
                }
            });
        });

        async function fetchBooks() {
            try {
                const response = await fetch(`${BASE_API_URL}/api/books`);
                const books = await response.json();
                if (!response.ok) {
                    throw new Error('Failed to fetch books');
                }
                const bookTable = document.getElementById('book-table-body');
                bookTable.innerHTML = '';
                books.forEach(book => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td class="border px-4 py-2">${book.title}</td>
                        <td class="border px-4 py-2">${book.author}</td>
                        <td class="border px-4 py-2"><a href="${book.link}" target="_blank" class="text-blue-600">View</a></td>
                        <td class="border px-4 py-2">${book.clicks || 0}</td>
                        <td class="border px-4 py-2">
                            <button onclick="deleteBook('${book.id}')" class="text-red-600 hover:text-red-800">
                                <i class="bi bi-trash"></i> Delete
                            </button>
                        </td>
                    `;
                    bookTable.appendChild(row);
                });
            } catch (error) {
                console.error('Error fetching books:', error);
                Swal.fire('Error!', 'Failed to load books. Please try again.', 'error');
            }
        }

        async function deleteBook(bookId) {
            try {
                const response = await fetch(`${BASE_API_URL}/api/books/${bookId}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' }
                });
                const result = await response.json();
                if (result.success) {
                    Swal.fire('Success!', 'Book deleted!', 'success');
                    await fetchBooks();
                } else {
                    throw new Error(result.error || 'Failed to delete book');
                }
            } catch (error) {
                console.error('Error deleting book:', error);
                Swal.fire('Error!', 'Failed to delete book. Please try again.', 'error');
            }
        }
    </script>
</head>

                                <i id="lightIcon" class="bi bi-brightness-high peer-checked:hidden"></i>
                                <i id="darkIcon" class="bi bi-moon-stars-fill hidden peer-checked:block"></i>
                            </span>
                        </div>
                    </label>
                </div>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center py-5">
        <div class="admin-card p-6 mx-4 w-full max-w-4xl">
            <h2 class="text-2xl font-semibold text-center mb-4 font-poppins">Admin Panel 🔒</h2>
            <p class="text-center text-gray-600 mb-4">Manage books and stats for GenZZ Library! ✨</p>
            
            <!-- Book Upload Form -->
            <div class="mb-6">
                <h3 class="text-xl font-semibold mb-2">Add New Book</h3>
                <form id="book-form" class="grid grid-cols-1 gap-4">
                    <input id="book-title" type="text" placeholder="Book Title" class="border rounded-lg p-2" required>
                    <input id="book-author" type="text" placeholder="Author" class="border rounded-lg p-2" required>
                    <input id="book-link" type="url" placeholder="Google Drive Link" class="border rounded-lg p-2" required>
                    <input id="book-image" type="url" placeholder="Image URL" class="border rounded-lg p-2" required>
                    <select id="book-class" class="border rounded-lg p-2" required>
                        <option value="" disabled selected>Select Class</option>
                        <option value="9th">9th</option>
                        <option value="10th">10th</option>
                        <option value="11th">11th</option>
                        <option value="12th">12th</option>
                    </select>
                    <select id="book-exam" class="border rounded-lg p-2" required>
                        <option value="" disabled selected>Select Exam</option>
                        <option value="Board">Board</option>
                        <option value="JEE">JEE</option>
                        <option value="NEET">NEET</option>
                        <option value="OTHER">OTHER</option>
                    </select>
                    <button type="submit" class="btn-access flex items-center justify-center">
                        <i class="bi bi-plus-circle mr-2"></i> Add Book
                    </button>
                </form>
            </div>

            <!-- Book List Table -->
            <div>
                <h3 class="text-xl font-semibold mb-2">Manage Books</h3>
                <div class="overflow-x-auto">
                    <table class="w-full border-collapse">
                        <thead>
                            <tr class="bg-gray-100 dark:bg-gray-700">
                                <th class="border px-4 py-2 text-left">Title</th>
                                <th class="border px-4 py-2 text-left">Author</th>
                                <th class="border px-4 py-2 text-left">Link</th>
                                <th class="border px-4 py-2 text-left">Clicks</th>
                                <th class="border px-4 py-2 text-left">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="book-table-body">
                            <!-- Books will be dynamically loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer-section py-4">
        <div class="container mx-auto px-4">
            <p class="made-with-heart text-center mb-0">Made with ❤️ by GenZ-Coders</p>
        </div>
    </footer>

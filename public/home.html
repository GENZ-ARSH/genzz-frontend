        // Telegram links
        const telegramLinks = {
            group: 'https://t.me/genzzthinks',

        };

        // Sanitize Input
        function sanitizeInput(input) {
            const div = document.createElement('div');
            div.textContent = input;
            return div.innerHTML;
        }

        // Debounce
        function debounce(func, wait) {
            let timeout;
            return function (...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }

        // Get CSRF Token
        async function getCsrfToken() {
            let retries = 3;
            while (retries) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 5000);
                    const response = await fetch(`${BASE_API_URL}/api/csrf-token`, {
                        method: 'GET',
                        credentials: 'include',
                        signal: controller.signal,
                    });
                    clearTimeout(timeoutId);
                    const data = await response.json();
                    if (!data.csrfToken) throw new Error('No CSRF token received');
                    return data.csrfToken;
                } catch (error) {
                    retries -= 1;
                    console.error('Error fetching CSRF token:', error);
                    if (!retries) return null;
                    await new Promise(resolve => setTimeout(resolve, 1000));
                }
            }
            return null;
        }

        // Validate Key
        async function validateKey() {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 15000);
                const response = await fetch(`${BASE_API_URL}/api/validate-key`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    signal: controller.signal,
                });
                clearTimeout(timeoutId);
                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.error || 'Token validation failed');
                }
                return result;
            } catch (error) {
                throw error;
            }
        }

        // Prompt Admin Login
        async function promptAdminLogin(isInitialLoad = false) {
            const csrfToken = await getCsrfToken();
            if (!csrfToken) {
                Swal.fire('Error!', 'Failed to initialize security. Try again or contact support on Telegram: ' + TELEGRAM_CHANNEL, 'error');
                return false;
            }

            const result = await Swal.fire({
                title: 'Admin Access 🔒',
                html: `
                    <input type="password" id="admin-password" class="swal2-input" placeholder="Enter admin password">
                    <input type="hidden" id="csrf-token" value="${csrfToken}">
                `,
                confirmButtonText: 'Login',
                showCancelButton: true,
                cancelButtonText: 'Cancel',
                backdrop: `
                    rgba(0,0,123,0.4)
                    url("https://sweetalert2.github.io/images/nyan-cat.gif")
                    left top
                    no-repeat
                `,
                customClass: { popup: 'animated bounceIn', confirmButton: 'btn-access' },
                preConfirm: async () => {
                    const password = sanitizeInput(document.getElementById('admin-password').value);
                    const csrfToken = document.getElementById('csrf-token').value;
                    if (!password) {
                        Swal.showValidationMessage('Password is required!');
                        return false;
                    }
                    try {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 5000);
                        const response = await fetch(`${BASE_API_URL}/api/admin-login`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'X-CSRF-Token': csrfToken,
                            },
                            body: JSON.stringify({ password, _csrf: csrfToken }),
                            credentials: 'include',
                            signal: controller.signal,
                        });
                        clearTimeout(timeoutId);
                        const result = await response.json();
                        if (result.success) {
                            return true;
                        } else {
                            Swal.showValidationMessage(result.error || 'Wrong password!');
                            return false;
                        }
                    } catch (error) {
                        console.error('Admin login fetch error:', error);
                        Swal.showValidationMessage('Server error. Try again or contact: ' + TELEGRAM_CHANNEL);
                        return false;
                    }
                },
            });

            if (result.isConfirmed) {
                clickSound.play();
                localStorage.setItem('isAdmin', 'true');
                if (!isInitialLoad) {
                    Swal.fire({
                        title: 'Success!',
                        text: 'Admin access granted! Redirecting...',
                        icon: 'success',
                        timer: 2000,
                        showConfirmButton: false
                    }).then(() => {
                        window.location.href = './admin.html';
                    });
                }
                return true;
            }
            return false;
        }

        // Check Access
        async function checkAccess() {
            const isAdmin = localStorage.getItem('isAdmin') === 'true';
            const directAccess = localStorage.getItem('directAccess') === 'success';

            if (isAdmin || directAccess) {
                clickSound.play();
                document.getElementById('loading-overlay').style.display = 'none';
                document.querySelector('.books-section').style.display = 'block';
                loadBooks();
                return;
            }

            const isAdminAttempt = await Swal.fire({
                title: 'Access Type',
                text: 'Are you an admin?',
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'Yes, I’m an admin',
                cancelButtonText: 'No, I’m a user',
                customClass: { confirmButton: 'btn-access' }
            });

            if (isAdminAttempt.isConfirmed) {
                const adminSuccess = await promptAdminLogin(true);
                if (!adminSuccess) {
                    window.location.href = './index.html';
                    return;
                }
                clickSound.play();
                document.getElementById('loading-overlay').style.display = 'none';
                document.querySelector('.books-section').style.display = 'block';
                loadBooks();
                return;
            }

            Swal.fire({
                title: 'Validating Your Key 🔑',
                text: 'Please wait while we verify your access...',
                allowOutsideClick: false,
                didOpen: () => {
                    Swal.showLoading();
                },
            });

            try {
                const result = await validateKey();
                Swal.fire({
                    title: 'Login Success! 🎉',
                    text: 'Welcome to the GenZZ Library! You can now download books.',
                    icon: 'success',
                    timer: 2000,
                    showConfirmButton: false,
                }).then(() => {
                    clickSound.play();
                    localStorage.setItem('pdflogin', 'success');
                    localStorage.setItem('pdflogin_expiration', result.expiry);
                    document.getElementById('loading-overlay').style.display = 'none';
                    document.querySelector('.books-section').style.display = 'block';
                    loadBooks();
                });
            } catch (error) {
                console.error('Key validation error:', error);
                Swal.fire({
                    title: 'BHAI KEY GENERATE KRLE 😜',
                    text: 'Your key is invalid or expired. Generate a new one! Contact support if issue persists: ' + TELEGRAM_CHANNEL,
                    icon: 'error',
                    confirmButtonText: 'Go to Key Generator',
                    customClass: { confirmButton: 'btn-access' }
                }).then(() => {
                    localStorage.clear();
                    window.location.href = './index.html';
                });
            }
        }

        // Load Books
        async function loadBooks(page = 1, limit = 12) {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 15000);
                const response = await fetch(`${BASE_API_URL}/api/books?page=${page}&limit=${limit}`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    signal: controller.signal,
                });
                clearTimeout(timeoutId);
                if (!response.ok) throw new Error('Failed to fetch books');
                const books = await response.json();

                const booksGrid = document.querySelector('.books-grid');
                books.forEach(book => {
                    const card = document.createElement('div');
                    card.className = 'book-card';
                    card.dataset.id = book.id;
                    card.dataset.title = book.title;
                    card.dataset.class = book.class || 'general';
                    card.dataset.exam = book.exam || 'general';
                    card.dataset.category = book.category || 'General';
                    card.innerHTML = `
                        <img src="${book.image_url}" class="book-cover" alt="${book.title}" loading="lazy">
                        <h5 class="book-title">${book.title}</h5>
                        <p class="book-author">${book.author || 'Unknown'}</p>
                        <a href="${book.link}" target="_blank" class="btn-download">Download PDF</a>
                    `;
                    booksGrid.appendChild(card);
                });

                // Show Load More button if more books exist
                if (books.length === limit) {
                    const loadMoreBtn = document.createElement('button');
                    loadMoreBtn.className = 'load-more';
                    loadMoreBtn.textContent = 'Load More';
                    loadMoreBtn.addEventListener('click', () => {
                        loadBooks(page + 1, limit);
                        loadMoreBtn.remove();
                    });
                    booksGrid.after(loadMoreBtn);
                }
            } catch (error) {
                console.error('Error loading books:', error);
                Swal.fire({
                    title: 'Error!',
                    text: 'Books load nahi hui, bhai! Check internet ya Telegram pe bol: ' + TELEGRAM_CHANNEL,
                    icon: 'error',
                    confirmButtonText: 'Ok',
                    customClass: { confirmButton: 'btn-access' }
                });
            }
        }

        // Filter Books
        function filterBooks(query, classFilter = '', examFilter = '', categoryFilter = '') {
            const cards = document.querySelectorAll('.book-card');
            query = query.toLowerCase();
            cards.forEach(card => {
                const title = card.dataset.title.toLowerCase();
                const classType = card.dataset.class.toLowerCase();
                const exam = card.dataset.exam.toLowerCase();
                const category = card.dataset.category.toLowerCase();
                const matchesQuery = query ? title.includes(query) : true;
                const matchesClass = classFilter ? classType === classFilter.toLowerCase() : true;
                const matchesExam = examFilter ? exam === examFilter.toLowerCase() : true;
                const matchesCategory = categoryFilter ? category === categoryFilter.toLowerCase() : true;
                if (matchesQuery && matchesClass && matchesExam && matchesCategory) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // Add Chatbot Message
        function addChatbotMessage(message, isBot = false) {
            const messages = document.getElementById('chatbot-messages');
            const div = document.createElement('div');
            div.className = `chatbot-message ${isBot ? 'bot' : 'user'}`;
            div.innerHTML = sanitizeInput(message);
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        // Handle Chatbot Input
        async function handleChatbotInput() {
            const input = document.getElementById('chatbot-input-text');
            const message = input.value.trim();
            if (!message) return;

            addChatbotMessage(message);
            input.value = '';

            const lowerMessage = message.toLowerCase();

            if (lowerMessage === '/admin') {
                addChatbotMessage('Bhai, admin banne ke liye password daal! 😎', true);
                const adminSuccess = await promptAdminLogin();
                if (!adminSuccess) {
                    addChatbotMessage('Admin login cancel kiya. Koi na, books dekh le! 📚', true);
                }
                return;
            }

            if (lowerMessage === '/links') {
                addChatbotMessage(`
                    📢 **GenZZ Community Links** 📢
                    - Telegram Group: ${telegramLinks.group}
                    - Telegram Channel: ${telegramLinks.channel}
                    - Owner: ${telegramLinks.owner}
                    Join karo for updates aur support! 😎
                `, true);
                return;
            }

            if (lowerMessage === '/contact') {
                addChatbotMessage(`
                    📩 **Contact Us** 📩
                    Owner se direct baat karo: ${telegramLinks.owner}
                    Ya Telegram group join karo: ${telegramLinks.group}
                    Fast response guaranteed! 🚀
                `, true);
                return;
            }

            if (lowerMessage === '/help') {
                addChatbotMessage(`
                    🆘 **Chatbot Help** 🆘
                    Commands:
                    - **/links**: Telegram group, channel, aur owner ke links.
                    - **/contact**: Owner se direct contact karo.
                    - **/admin**: Admin panel access (password required).
                    - **/faq**: List all FAQs.
                    - **/help**: Yeh help message.
                    Ask anything like "how to download" ya set name: "Name: TeraNaam"
                `, true);
                return;
            }

            if (lowerMessage === '/faq') {
                let faqList = '📚 **All FAQs** 📚\n';
                for (const faq of Object.values(faqs)) {
                    faqList += `- ${faq.question}\n`;
                }
                faqList += 'Ask any of these ya Telegram pe chill: ' + TELEGRAM_CHANNEL;
                addChatbotMessage(faqList, true);
                return;
            }

            const nameMatch = message.match(/^Name:\s*(.+)$/i);
            if (nameMatch) {
                localStorage.setItem('chatbotName', nameMatch[1]);
                addChatbotMessage('Naam save ho gaya, bhai! Ab query puchh ya /links check kar.', true);
                return;
            }

            let found = false;
            for (const [key, faq] of Object.entries(faqs)) {
                if (lowerMessage.includes(key)) {
                    addChatbotMessage(`
                        ❓ **${faq.question}** ❓
                        ${faq.answer}
                    `, true);
                    found = true;
                    break;
                }
            }

            if (!found) {
                const name = localStorage.getItem('chatbotName') || 'Anonymous';
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 5000);
                    const response = await fetch(`${BASE_API_URL}/api/reviews`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, message }),
                        credentials: 'include',
                        signal: controller.signal,
                    });
                    clearTimeout(timeoutId);
                    const result = await response.json();
                    if (result.success) {
                        addChatbotMessage(`
                            Query bhej di, bhai! Team Telegram pe dekhegi: ${telegramLinks.channel}. 😊
                            Try asking specific questions like "how to download" ya check /help!
                        `, true);
                    } else {
                        addChatbotMessage(`Query bhejne mein error: ${result.error || 'Kuch toh gadbad hai'}. Fir se try kar ya Telegram pe bol: ${telegramLinks.channel}`, true);
                    }
                } catch (error) {
                    console.error('Query submission error:', error);
                    addChatbotMessage(`Server error, bhai. Thodi der baad try kar ya Telegram group mein chill: ${telegramLinks.group}`, true);
                }
            }
        }

        // Initialize Filters
        function initFilters() {
            const filterContainer = document.createElement('div');
            filterContainer.className = 'filter-buttons';
            const filters = [
                { type: 'class', values: ['10th', '11th', '12th', 'all'] },
                { type: 'exam', values: ['Board', 'JEE', 'NEET', 'all'] },
                { type: 'category', values: ['Physics', 'Chemistry', 'Mathematics', 'Biology', 'General'] },
            ];

            filters.forEach(filter => {
                filter.values.forEach(value => {
                    const btn = document.createElement('button');
                    btn.className = 'filter-btn';
                    btn.dataset[filter.type] = value.toLowerCase();
                    btn.textContent = value;
                    btn.addEventListener('click', () => {
                        const activeBtn = filterContainer.querySelector(`[data-${filter.type}].active`);
                        if (activeBtn) activeBtn.classList.remove('active');
                        btn.classList.add('active');
                        filterBooks(
                            document.getElementById('search').value,
                            filterContainer.querySelector('[data-class].active')?.dataset.class || '',
                            filterContainer.querySelector('[data-exam].active')?.dataset.exam || '',
                            filterContainer.querySelector('[data-category].active')?.dataset.category || ''
                        );
                    });
                    filterContainer.appendChild(btn);
                });
            });

            document.querySelector('.search-bar').after(filterContainer);
        }

        document.addEventListener('DOMContentLoaded', async function () {
            const darkModeEnabled = localStorage.getItem('darkMode') === 'enabled';
            if (darkModeEnabled) {
                document.body.classList.add('dark-mode');
                document.getElementById('darkModeToggle').checked = true;
            }
            document.getElementById('darkModeToggle').addEventListener('change', function () {
                clickSound.play();
                document.body.classList.toggle('dark-mode', this.checked);
                localStorage.setItem('darkMode', this.checked ? 'enabled' : 'disabled');
            });

            initFilters();
            checkAccess();

            document.getElementById('chatbot-button').addEventListener('click', function () {
                clickSound.play();
                const window = document.getElementById('chatbot-window');
                window.style.display = window.style.display === 'flex' ? 'none' : 'flex';
                if (window.style.display === 'flex') {
                    addChatbotMessage(`
                        Yo bhai, welcome to GenZZ Chatbot! 😎
                        Ask anything like "how to download" ya try commands:
                        - /links for Telegram group, channel, aur owner
                        - /contact to reach the boss
                        - /admin for admin access
                        - /faq to list all FAQs
                        - /help for all commands
                    `, true);
                }
            });

            document.getElementById('chatbot-input-text').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    clickSound.play();
                    handleChatbotInput();
                }
            });
            document.getElementById('chatbot-input-button').addEventListener('click', function () {
                clickSound.play();
                handleChatbotInput();
            });

            document.getElementById('search').addEventListener('input', debounce(function () {
                filterBooks(
                    this.value,
                    document.querySelector('[data-class].active')?.dataset.class || '',
                    document.querySelector('[data-exam].active')?.dataset.exam || '',
                    document.querySelector('[data-category].active')?.dataset.category || ''
                );
            }, 300));

            document.querySelectorAll('.btn-download, .btn-access').forEach(button => {
                button.addEventListener('click', async function (e) {
                    clickSound.play();
                    const bookCard = e.target.closest('.book-card');
                    if (bookCard) {
                        const bookId = bookCard.dataset.id;
                        try {
                            const controller = new AbortController();
                            const timeoutId = setTimeout(() => controller.abort(), 5000);
                            await fetch(`${BASE_API_URL}/api/books/${bookId}/click`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                credentials: 'include',
                                signal: controller.signal,
                            });
                            clearTimeout(timeoutId);
                        } catch (error) {
                            console.error('Error tracking click:', error);
                        }
                    }

                    const rect = e.target.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    tsParticles.load('sparkles-' + Date.now(), {
                        fullScreen: { enable: false },
                        particles: {
                            number: { value: 20 },
                            color: { value: ['#facc15', '#f97316'] },
                            shape: { type: 'star' },
                            opacity: { value: 0.8, animation: { enable: true, minimumValue: 0, speed: 2 } },
                            size: { value: 5, random: true },
                            move: {
                                enable: true,
                                speed: 10,
                                direction: 'none',
                                outModes: { default: 'destroy' }
                            },
                        },
                        emitters: {
                            position: { x, y },
                            rate: { quantity: 20, delay: 0 },
                        },
                    });
                });
            });

            document.querySelectorAll('.footer-links a').forEach(link => {
                link.addEventListener('click', () => clickSound.play());
            });
        });
    </script>

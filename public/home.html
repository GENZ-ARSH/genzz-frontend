    <script>
        const BASE_API_URL = 'https://genzz-backend.onrender.com';
        const clickSound = new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA');
        clickSound.volume = 0.3;

        function sanitizeInput(input) {
            const div = document.createElement('div');
            div.textContent = input;
            return div.innerHTML;
        }

        async function getCsrfToken() {
            try {
                const response = await fetch(`${BASE_API_URL}/api/csrf-token`, {
                    method: 'GET',
                    credentials: 'include'
                });
                const data = await response.json();
                return data.csrfToken;
            } catch (error) {
                console.error('Error fetching CSRF token:', error);
                return null;
            }
        }

        async function validateKey() {
            try {
                const response = await fetch(`${BASE_API_URL}/api/validate-key`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include'
                });
                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.error || 'Token validation failed');
                }
                return result;
            } catch (error) {
                throw error;
            }
        }

        async function promptAdminLogin(isInitialLoad = false) {
            const csrfToken = await getCsrfToken();
            if (!csrfToken) {
                Swal.fire('Error!', 'Failed to initialize security.', 'error');
                return false;
            }

            const result = await Swal.fire({
                title: 'Admin Access 🔒',
                html: `
                    <input type="password" id="admin-password" class="swal2-input" placeholder="Enter admin password">
                    <input type="hidden" id="csrf-token" value="${csrfToken}">
                `,
                confirmButtonText: 'Login',
                showCancelButton: true,
                preConfirm: async () => {
                    const password = sanitizeInput(document.getElementById('admin-password').value);
                    const csrfToken = document.getElementById('csrf-token').value;
                    if (!password) {
                        Swal.showValidationMessage('Password is required!');
                        return false;
                    }
                    try {
                        const response = await fetch(`${BASE_API_URL}/api/admin-login`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'X-CSRF-Token': csrfToken
                            },
                            body: JSON.stringify({ password, _csrf: csrfToken }),
                            credentials: 'include'
                        });
                        const result = await response.json();
                        if (result.success) {
                            return true;
                        } else {
                            Swal.showValidationMessage(result.error || 'Wrong password!');
                            return false;
                        }
                    } catch (error) {
                        console.error('Admin login fetch error:', error);
                        Swal.showValidationMessage('Server error');
                        return false;
                    }
                }
            });

            if (result.isConfirmed) {
                clickSound.play();
                localStorage.setItem('isAdmin', 'true');
                if (!isInitialLoad) {
                    Swal.fire('Success!', 'Admin access granted! Redirecting...', 'success').then(() => {
                        window.location.href = './admin.html';
                    });
                }
                return true;
            }
            return false;
        }

        async function checkAccess() {
            const isAdmin = localStorage.getItem('isAdmin') === 'true';
            const directAccess = localStorage.getItem('directAccess') === 'success';

            if (isAdmin || directAccess) {
                clickSound.play();
                document.getElementById('loading-overlay').style.display = 'none';
                document.querySelector('.books-section').style.display = 'block';
                loadBooks();
                return;
            }

            const isAdminAttempt = await Swal.fire({
                title: 'Access Type',
                text: 'Are you an admin?',
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'Yes, I’m an admin',
                cancelButtonText: 'No, I’m a user'
            });

            if (isAdminAttempt.isConfirmed) {
                const adminSuccess = await promptAdminLogin(true);
                if (!adminSuccess) {
                    window.location.href = './index.html';
                    return;
                }
                clickSound.play();
                document.getElementById('loading-overlay').style.display = 'none';
                document.querySelector('.books-section').style.display = 'block';
                loadBooks();
                return;
            }

            Swal.fire({
                title: 'Validating Your Key 🔑',
                text: 'Please wait while we verify your access...',
                allowOutsideClick: false,
                didOpen: () => {
                    Swal.showLoading();
                }
            });

            try {
                const result = await validateKey();
                Swal.fire({
                    title: 'Login Success! 🎉',
                    text: 'Welcome to the GenZZ Library! You can now download books.',
                    icon: 'success',
                    timer: 2000,
                    showConfirmButton: false
                }).then(() => {
                    clickSound.play();
                    localStorage.setItem('pdflogin', 'success');
                    localStorage.setItem('pdflogin_expiration', result.expiry);
                    document.getElementById('loading-overlay').style.display = 'none';
                    document.querySelector('.books-section').style.display = 'block';
                    loadBooks();
                });
            } catch (error) {
                console.error('Key validation error:', error);
                Swal.fire({
                    title: 'BHAI KEY GENERATE KRLE 😜',
                    text: 'Your key is invalid or expired. Generate a new one!',
                    icon: 'error',
                    confirmButtonText: 'Go to Key Generator'
                }).then(() => {
                    localStorage.clear();
                    window.location.href = './index.html';
                });
            }
        }

        async function loadBooks() {
            try {
                const response = await fetch(`${BASE_API_URL}/api/books`);
                const books = await response.json();
                const booksGrid = document.querySelector('.books-grid');
                booksGrid.innerHTML = '';
                books.forEach(book => {
                    const card = document.createElement('div');
                    card.className = 'book-card';
                    card.dataset.title = book.title;
                    card.dataset.id = book._id;
                    card.dataset.class = book.class;
                    card.dataset.exam = book.exam;
                    card.innerHTML = `
                        <img src="${book.coverUrl}" class="book-cover" alt="${book.title}">
                        <h5 class="book-title">${book.title}</h5>
                        <p class="book-author">${book.author}</p>
                        <a href="${book.pdfLink}" target="_blank" class="btn-download">Download PDF</a>
                    `;
                    booksGrid.appendChild(card);
                });
            } catch (error) {
                console.error('Error loading books:', error);
                Swal.fire('Error!', 'Books load nahi hui, bhai!', 'error');
            }
        }

        function filterBooks(query) {
            const cards = document.querySelectorAll('.book-card');
            query = query.toLowerCase();
            cards.forEach(card => {
                const title = card.dataset.title.toLowerCase();
                const classType = card.dataset.class.toLowerCase();
                const exam = card.dataset.exam.toLowerCase();
                if (title.includes(query) || classType.includes(query) || exam.includes(query)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function addChatbotMessage(message, isBot = false) {
            const messages = document.getElementById('chatbot-messages');
            const div = document.createElement('div');
            div.className = `chatbot-message ${isBot ? 'bot' : 'user'}`;
            div.innerHTML = sanitizeInput(message);
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        async function handleChatbotInput() {
            const input = document.getElementById('chatbot-input-text');
            const message = input.value.trim();
            if (!message) return;

            addChatbotMessage(message);
            input.value = '';

            if (message.toLowerCase() === '/admin') {
                addChatbotMessage('Bhai, admin banne ke liye password daal! 🔒', true);
                const csrfToken = await getCsrfToken();
                if (!csrfToken) {
                    addChatbotMessage('Security issue, bhai! Try again ya Telegram pe contact kar.', true);
                    return;
                }

                const result = await Swal.fire({
                    title: 'Admin Login 😎',
                    html: `
                        <input type="password" id="admin-password" class="swal2-input" placeholder="Password daal, ladle!">
                        <input type="hidden" id="csrf-token" value="${csrfToken}">
                    `,
                    confirmButtonText: 'Login Karo, Boss!',
                    showCancelButton: true,
                    cancelButtonText: 'Nahi, Chhod Do',
                    preConfirm: async () => {
                        const password = sanitizeInput(document.getElementById('admin-password').value);
                        const csrfToken = document.getElementById('csrf-token').value;
                        if (!password) {
                            Swal.showValidationMessage('Password toh daal, bhai!');
                            return false;
                        }
                        try {
                            const response = await fetch(`${BASE_API_URL}/api/admin-login`, {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'X-CSRF-Token': csrfToken
                                },
                                body: JSON.stringify({ password, _csrf: csrfToken }),
                                credentials: 'include'
                            });
                            const result = await response.json();
                            if (result.success) {
                                return true;
                            } else {
                                Swal.showValidationMessage(result.error || 'Galat password, ladle!');
                                return false;
                            }
                        } catch (error) {
                            console.error('Admin login fetch error:', error);
                            Swal.showValidationMessage('Server error, bhai! Baad mein try kar.');
                            return false;
                        }
                    }
                });

                if (result.isConfirmed) {
                    clickSound.play();
                    localStorage.setItem('isAdmin', 'true');
                    addChatbotMessage('Bhai, tu toh admin hai! Redirecting to admin panel... 🚀', true);
                    Swal.fire({
                        title: 'Admin Access Mil Gaya! 😎',
                        text: 'Ab admin panel mein jaa raha hai!',
                        icon: 'success',
                        timer: 2000,
                        showConfirmButton: false
                    }).then(() => {
                        window.location.href = './admin.html';
                    });
                } else {
                    addChatbotMessage('Admin login cancel kiya. Koi na, books dekh le! 📚', true);
                }
                return;
            }

            const nameMatch = message.match(/^Name:\s*(.+)$/i);
            if (nameMatch) {
                localStorage.setItem('chatbotName', nameMatch[1]);
                addChatbotMessage('Naam save ho gaya! Ab query ya feedback daal, bhai.', true);
                return;
            }

            const name = localStorage.getItem('chatbotName') || 'Anonymous';
            try {
                const response = await fetch(`${BASE_API_URL}/api/reviews`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, message })
                });
                const result = await response.json();
                if (result.success) {
                    addChatbotMessage('Query bhej di, bhai! Team jaldi reply karegi. 😊', true);
                } else {
                    addChatbotMessage(`Query bhejne mein error: ${result.error || 'Kuch toh gadbad hai'}. Fir se try kar, ladle!`, true);
                }
            } catch (error) {
                console.error('Error submitting query:', error);
                addChatbotMessage('Server error, bhai. Thodi der baad try kar ya Telegram pe chill kar! 😎', true);
            }
        }

        document.addEventListener('DOMContentLoaded', async function () {
            const darkModeEnabled = localStorage.getItem('darkMode') === 'enabled';
            if (darkModeEnabled) {
                document.body.classList.add('dark-mode');
                document.getElementById('darkModeToggle').checked = true;
            }
            document.getElementById('darkModeToggle').addEventListener('change', function () {
                try {
                    clickSound.play();
                    if (this.checked) {
                        document.body.classList.add('dark-mode');
                        localStorage.setItem('darkMode', 'enabled');
                    } else {
                        document.body.classList.remove('dark-mode');
                        localStorage.setItem('darkMode', 'disabled');
                    }
                } catch (error) {
                    console.error('Dark mode toggle error:', error);
                    Swal.fire('Error!', 'Failed to toggle dark mode.', 'error');
                }
            });

            checkAccess();

            document.getElementById('chatbot-button').addEventListener('click', function () {
                clickSound.play();
                const window = document.getElementById('chatbot-window');
                window.style.display = window.style.display === 'flex' ? 'none' : 'flex';
                if (window.style.display === 'flex') {
                    addChatbotMessage('Welcome, bhai! Name daal (e.g., "Name: John"), query bhej, ya /admin type kar admin banne ke liye.', true);
                }
            });
            document.getElementById('chatbot-input-text').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    clickSound.play();
                    handleChatbotInput();
                }
            });
            document.getElementById('chatbot-input-button').addEventListener('click', function () {
                clickSound.play();
                handleChatbotInput();
            });

            document.getElementById('search').addEventListener('input', function () {
                filterBooks(this.value);
            });

            document.querySelectorAll('.btn-download, .btn-access').forEach(button => {
                button.addEventListener('click', async function (e) {
                    clickSound.play();
                    const bookCard = e.target.closest('.book-card');
                    if (bookCard) {
                        const bookId = bookCard.dataset.id;
                        try {
                            await fetch(`${BASE_API_URL}/api/books/${bookId}/click`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                credentials: 'include'
                            });
                        } catch (error) {
                            console.error('Error tracking click:', error);
                        }
                    }

                    const rect = e.target.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    tsParticles.load('sparkles-' + Date.now(), {
                        fullScreen: { enable: false },
                        particles: {
                            number: { value: 20 },
                            color: { value: ['#facc15', '#f97316'] },
                            shape: { type: 'star' },
                            opacity: { value: 0.8, animation: { enable: true, minimumValue: 0, speed: 2 } },
                            size: { value: 5, random: true },
                            move: {
                                enable: true,
                                speed: 10,
                                direction: 'none',
                                outModes: { default: 'destroy' }
                            }
                        },
                        emitters: {
                            position: { x, y },
                            rate: { quantity: 20, delay: 0 }
                        }
                    });
                });
            });

            document.querySelectorAll('.footer-links a').forEach(link => {
                link.addEventListener('click', () => clickSound.play());
            });
        });
    </script>
</head>

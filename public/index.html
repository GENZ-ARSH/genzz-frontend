    <script>
        const BASE_API_URL = 'https://genzz-backend.onrender.com';
        const HOME_URL = '/home.html';
        const clickSound = new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA');
        clickSound.volume = 0.3;

        // Debounce to prevent multiple clicks
        function debounce(func, wait) {
            let timeout;
            return function (...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }

        // Expanded FAQ database
        const faqs = {
            'how to generate key': {
                question: 'How do I generate an access key?',

            },
            'key not working': {

                answer: 'Key expire ho sakta hai (24 ya 48 hours). Naya key generate kar. Internet check kar ya cookies clear kar. Phir bhi issue? Telegram pe bol: https://t.me/genzcoders1'

                question: 'What is GenZZ Library?',
                answer: 'GenZZ Library ek free platform hai for 10th-12th, Board, JEE, NEET ke study materials. Secure key se access karo aur updates ke liye Telegram join karo: https://t.me/genzcoders1'
            },
            'is it free': {

                answer: 'Bilku free, bhai! Bas key generate karo secure access ke liye. No charges, promise! Support ke liye Telegram join kar: https://t.me/genzcoders1'

            'how to contact support': {
                question: 'How do I contact support?',

            'books not loading': {
                question: 'Why are books not loading?',
                answer: 'Internet check karo ya page refresh karo. Key expire ho gaya toh naya banaye. Issue rahe toh Telegram pe bataye: https://t.me/genzcoders1'

            'how to access admin': {
                question: 'How do I access the admin panel?',
                answer: 'Sirf authorized admins ke liye. Footer pe triple-click karo ya home page ke chatbot mein /admin type karo aur password daalo. Queries ke liye Telegram pe contact: https://t.me/genzcoders1'
            },
            'how to join telegram': {
                question: 'How do I join the Telegram community?',
                answer: 'Group mein join karo: https://t.me/genzzthinks ya channel pe aao: https://t.me/genzcoders1. Updates aur support ke liye perfect hai!'
            },
            'how to suggest books': {
                question: 'Can I suggest books for the library?',
                answer: 'Haan, bhai! Telegram group mein suggestion daal do: https://t.me/genzzthinks ya owner ko directly bol: @just_arsh1. Hum jaldi review karenge.'
            },
            'safe to use': {
                question: 'Is GenZZ Library safe to use?',
                answer: '100% safe, bro! Secure keys aur CSRF protection hai. Privacy ka full dhyaan rakhte hain. Doubt ho toh Telegram pe clarify kar: https://t.me/genzcoders1'
            },
            'lost access': {
                question: 'I lost access to the library, what now?',
                answer: 'Key expire ho gaya hoga. Naya key generate karo iss page se. Cookies clear karo ya browser change karo. Issue ho toh Telegram pe bol: https://t.me/genzcoders1'
            },
            'slow loading': {
                question: 'Why is the library loading slowly?',
                answer: 'Internet speed check karo ya low-bandwidth mode try karo. Cache clear karne se bhi help hoti hai. Issue rahe toh Telegram pe ping: https://t.me/genzcoders1'

                question: 'Which browsers are supported?',
                answer: 'Chrome, Firefox, Edge, aur Safari pe smooth chalta hai. Latest version use karo. Mobile browsers bhi kaam karte hain. Issue ho toh Telegram pe bol: https://t.me/genzcoders1'
            },

                question: 'How long does a key last?',
                answer: '24hr ya 48hr key choose karo. Time khatam hone pe naya key generate karna padega. Reminder ke liye Telegram join kar: https://t.me/genzcoders1'

            }
        };

        // Telegram links
        const telegramLinks = {
            group: 'https://t.me/genzzthinks',
            channel: 'https://t.me/genzcoders1',
            owner: '@just_arsh1'
        };

        // Sanitize input to prevent XSS
        function sanitizeInput(input) {
            const div = document.createElement('div');
            div.textContent = input;
            return div.innerHTML;
        }

        // Generate access key with enhanced error handling
        async function generateKey(duration) {
            try {
                const button = document.getElementById(`btn-${duration}`);
                button.disabled = true;
                clickSound.play();
                const loader = document.querySelector('.loader');
                loader.style.display = 'block';

                // 15s timeout for API call
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 15000);

                const response = await fetch(`${BASE_API_URL}/api/generate-key`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        duration,
                        userId: uuidv4(),
                        url: HOME_URL
                    }),
                    credentials: 'include',
                    signal: controller.signal
                });

                clearTimeout(timeoutId);
                loader.style.display = 'none';
                button.disabled = false;

                const result = await response.json();
                if (!response.ok || result.error) {
                    throw new Error(result.error || 'Key generate nahi hua, bhai!');
                }

                console.log('API Response:', result);
                if (result.shortUrl) {
                    window.location.href = result.shortUrl;
                } else {
                    throw new Error('Short URL nahi mila!');
                }
            } catch (error) {
                document.querySelector('.loader').style.display = 'none';
                document.getElementById(`btn-${duration}`).disabled = false;
                console.error('Key generation error:', error);
                Swal.fire({
                    title: 'Error!',
                    text: `Key generate nahi hua: ${error.message}. Internet check kar ya Telegram pe ping kar: ${telegramLinks.channel}`,
                    icon: 'error',
                    confirmButtonText: 'Ok'
                });
            }
        }

        // Add chatbot message
        function addChatbotMessage(message, isBot = false) {
            const messages = document.getElementById('chatbot-messages');
            const div = document.createElement('div');
            div.className = `chatbot-message ${isBot ? 'bot' : 'user'}`;
            div.innerHTML = sanitizeInput(message);
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        // Handle chatbot input with additional commands
        async function handleChatbotInput() {
            const input = document.getElementById('chatbot-input-text');
            const message = input.value.trim();
            if (!message) return;

            addChatbotMessage(message);
            input.value = '';

            const lowerMessage = message.toLowerCase();

            if (lowerMessage === '/auth') {
                const result = await Swal.fire({
                    title: 'Special Access 😎',
                    html: `<input type="password" id="auth-password" class="swal2-input" placeholder="Pass daal, ladle!">`,
                    confirmButtonText: 'Access Karo, Boss!',
                    showCancelButton: true,
                    cancelButtonText: 'Nahi, Chhod Do',
                    backdrop: `
                        rgba(0,0,123,0.4)
                        url("https://sweetalert2.github.io/images/nyan-cat.gif")
                        left top
                        no-repeat
                    `,
                    customClass: { popup: 'animated bounceIn', confirmButton: 'btn-access' },
                    preConfirm: async () => {
                        const password = sanitizeInput(document.getElementById('auth-password').value);
                        if (!password) {
                            Swal.showValidationMessage('Password toh daal, bhai!');
                            return false;
                        }
                        try {
                            const controller = new AbortController();
                            const timeoutId = setTimeout(() => controller.abort(), 5000);
                            const response = await fetch(`${BASE_API_URL}/api/auth`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ password }),
                                credentials: 'include',
                                signal: controller.signal
                            });
                            clearTimeout(timeoutId);
                            const result = await response.json();
                            if (result.success) return true;
                            Swal.showValidationMessage(result.error || 'Galat password, ladle!');
                            return false;
                        } catch (error) {
                            console.error('Auth error:', error);
                            Swal.showValidationMessage('Server error, bhai! Baad mein try kar.');
                            return false;
                        }
                    }
                });

                if (result.isConfirmed) {
                    clickSound.play();
                    Swal.fire({
                        title: 'Access Mil Gaya! 😎',
                        text: 'Ab library mein jaa raha hai!',
                        icon: 'success',
                        timer: 2000,
                        showConfirmButton: false
                    }).then(() => {
                        window.location.href = './home.html';
                    });
                } else {
                    addChatbotMessage('Access cancel kiya. Key generate kar ya Telegram pe chill: https://t.me/genzcoders1', true);
                }
                return;
            }

            if (lowerMessage === '/links') {
                addChatbotMessage(`
                    📢 **GenZZ Community Links** 📢
                    - Telegram Group: ${telegramLinks.group}
                    - Telegram Channel: ${telegramLinks.channel}
                    - Owner: ${telegramLinks.owner}
                    Join karo for updates aur support! 😎
                `, true);
                return;
            }

            if (lowerMessage === '/contact') {
                addChatbotMessage(`
                    📩 **Contact Us** 📩
                    Owner se direct baat karo: ${telegramLinks.owner}
                    Ya Telegram group join karo: ${telegramLinks.group}
                    Fast response guaranteed! 🚀
                `, true);
                return;
            }

            if (lowerMessage === '/help') {
                addChatbotMessage(`
                    🆘 **Chatbot Help** 🆘
                    Commands:
                    - **/links**: Telegram group, channel, aur owner ke links.
                    - **/contact**: Owner se direct contact karo.
                    - **/auth**: Special access without key (password required).
                    - **/faq**: List all FAQs.
                    - **/help**: Yeh help message.
                    Ask anything like "how to generate key" ya set name: "Name: TeraNaam"
                `, true);
                return;
            }

            if (lowerMessage === '/faq') {
                let faqList = '📚 **All FAQs** 📚\n';
                for (const faq of Object.values(faqs)) {
                    faqList += `- ${faq.question}\n`;
                }
                faqList += 'Ask any of these ya Telegram pe chill: https://t.me/genzcoders1';
                addChatbotMessage(faqList, true);
                return;
            }

            const nameMatch = message.match(/^Name:\s*(.+)$/i);
            if (nameMatch) {
                localStorage.setItem('chatbotName', nameMatch[1]);
                addChatbotMessage('Naam save ho gaya, bhai! Ab query puchh ya /links check kar.', true);
                return;
            }

            let found = false;
            for (const [key, faq] of Object.entries(faqs)) {
                if (lowerMessage.includes(key)) {
                    addChatbotMessage(`
                        ❓ **${faq.question}** ❓
                        ${faq.answer}
                    `, true);
                    found = true;
                    break;
                }
            }

            if (!found) {
                const name = localStorage.getItem('chatbotName') || 'Anonymous';
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 5000);

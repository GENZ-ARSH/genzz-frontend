    <style>
        body {
            margin: 0;
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #bfdbfe, #60a5fa);
            font-family: 'Inter', sans-serif;
        }
        .header-section {
            padding-top: 1rem;
            padding-bottom: 1rem;
        }
        .container {
            max-width: 1280px;
            margin-left: auto;
            margin-right: auto;
            padding-left: 1rem;
            padding-right: 1rem;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo-container {
            display: inline-block;
        }
        .flex-space-x-4 {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        main {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 1.25rem;
            padding-bottom: 1.25rem;
        }
        .access-card {
            padding: 1.5rem;
            margin-left: 1rem;
            margin-right: 1rem;
            width: 100%;
            max-width: 28rem;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 25px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }
        .access-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.25);
        }
        h2 {
            font-size: 1.5rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 1rem;
            font-family: 'Poppins', sans-serif;
        }
        p {
            color: #4b5563;
            text-align: center;
            margin-bottom: 1rem;
        }
        .flex-col-gap-3 {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            align-items: center;
        }
        .btn-access {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            padding: 0.9rem 2.8rem;
            background: linear-gradient(90deg, #facc15, #f97316);
            color: #1e40af;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3);
            text-decoration: none;
            border: none;
            cursor: pointer;
        }
        .btn-access:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 20px rgba(249, 115, 22, 0.5);
            background: linear-gradient(90deg, #eab308, #ea580c);
        }
        .btn-access::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.5s ease, height 0.5s ease;
        }
        .btn-access:hover::before {
            width: 350px;
            height: 350px;
        }
        .btn-access.text-sm {
            font-size: 0.875rem;
            padding: 0.5rem 1rem;
        }
        .btn-info {
            width: 75%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.875rem;
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            padding: 0.6rem 2rem;
            background: linear-gradient(90deg, #ef4444, #dc2626);
            color: #ffffff;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
            text-decoration: none;
        }
        .btn-info:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.5);
            background: linear-gradient(90deg, #dc2626, #b91c1c);
        }
        .btn-info::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.5s ease, height 0.5s ease;
        }
        .btn-info:hover::before {
            width: 300px;
            height: 300px;
        }
        .relative {
            position: relative;
        }
        .inline-flex {
            display: inline-flex;
            align-items: center;
            cursor: pointer;
        }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
        .rounded-full {
            border-radius: 9999px;
        }
        .peer:checked ~ .bg-blue-600 {
            background-color: #2563eb;
        }
        .transition-colors {
            transition: background-color 0.2s ease;
        }
        .w-11 {
            width: 2.75rem;
        }
        .h-6 {
            height: 1.5rem;
        }
        .bg-gray-200 {
            background-color: #e5e7eb;
        }
        .absolute {
            position: absolute;
        }
        .left-1 {
            left: 0.25rem;
        }
        .top-1 {
            top: 0.25rem;
        }
        .w-4 {
            width: 1rem;
        }
        .h-4 {
            height: 1rem;
        }
        .bg-white {
            background-color: #ffffff;
        }
        .transition-transform {
            transition: transform 0.2s ease;
        }
        .peer:checked ~ .translate-x-5 {
            transform: translateX(1.25rem);
        }
        .text-xs {
            font-size: 0.75rem;
        }
        .peer-checked\:hidden {
            display: none;
        }
        .peer-checked\:block {
            display: block;
        }
        .footer-section {
            padding-top: 1rem;
            padding-bottom: 1rem;
        }
        .mb-0 {
            margin-bottom: 0;
        }
        .dark-mode {
            background: linear-gradient(135deg, #1e3a8a, #1e40af);
            color: #ffffff;
        }
        .dark-mode .access-card {
            background: rgba(30, 30, 30, 0.98);
            color: #ffffff;
        }
        .dark-mode .header-section {
            background: rgba(30, 30, 30, 0.95);
        }
        .dark-mode .footer-section {
            background: rgba(255, 255, 255, 0.05);
        }
        .made-with-heart {
            font-family: 'Poppins', sans-serif;
            color: #1e40af;
            transition: color 0.3s ease;
        }
        .dark-mode .made-with-heart {
            color: #f97316;
        }
        .made-with-heart:hover {
            color: #f97316;
        }
    </style>
    <script>
        const BASE_API_URL = 'https://genzz-backend.onrender.com';
        const HOME_URL = '/protected.html';
        const clickSound = new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA');
        clickSound.volume = 0.3;

        document.addEventListener('DOMContentLoaded', function () {
            const darkModeEnabled = localStorage.getItem('darkMode') === 'enabled';
            if (darkModeEnabled) {
                document.body.classList.add('dark-mode');
                document.getElementById('darkModeToggle').checked = true;
            }
            document.getElementById('darkModeToggle').addEventListener('change', function () {
                try {
                    if (this.checked) {
                        document.body.classList.add('dark-mode');
                        localStorage.setItem('darkMode', 'enabled');
                    } else {
                        document.body.classList.remove('dark-mode');
                        localStorage.setItem('darkMode', 'disabled');
                    }
                } catch (error) {
                    console.error('Dark mode toggle error:', error);
                    Swal.fire('Error!', 'Failed to toggle dark mode.', 'error');
                }
            });

            let clickCount = 0;
            let clickTimer = null;
            document.getElementById('footer-text').addEventListener('click', function () {
                try {
                    clickCount++;
                    if (clickCount === 1) {
                        clickTimer = setTimeout(() => { clickCount = 0; }, 500);
                    } else if (clickCount === 3) {
                        clearTimeout(clickTimer);
                        clickCount = 0;
                        showDirectAccess();
                    }
                } catch (error) {
                    console.error('Footer click error:', error);
                    Swal.fire('Error!', 'Access failed!', 'error');
                }
            });
        });

        async function generateKey(duration) {
            try {
                clickSound.play();
                console.log('Generating key:', { duration, userId: 'guest', url: HOME_URL });
                const response = await fetch(`${BASE_API_URL}/api/generate-key`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ duration, userId: 'guest', url: HOME_URL }),
                    credentials: 'include'
                });
                console.log('Generate key response:', { status: response.status, ok: response.ok });
                const result = await response.text();
                console.log('Raw response:', result);

                let jsonResult;
                try {
                    jsonResult = JSON.parse(result);
                } catch (e) {
                    console.error('Response is not JSON:', result);
                    throw new Error('Server returned invalid response (not JSON)');
                }

                if (!response.ok || jsonResult.error) {
                    console.error('Key generation failed:', jsonResult.error);
                    throw new Error(jsonResult.error || `HTTP ${response.status}: Failed to generate key`);
                }

                localStorage.setItem('accessToken', jsonResult.token);
                localStorage.setItem('accessTokenExpiry', jsonResult.expiry);
                localStorage.setItem('shortUrl', jsonResult.shortUrl);
                console.log('Redirecting to shortUrl:', jsonResult.shortUrl);
                window.location.href = jsonResult.shortUrl;
            } catch (error) {
                console.error('Key generation error:', error.message);
                Swal.fire('Error!', `Failed to generate key: ${error.message}. Please try again.`, 'error');
            }
        }

        async function showDirectAccess() {
            try {
                Swal.fire({
                    title: 'Direct Access 🔑',
                    html: '<input type="password" id="access-password" class="swal2-input" placeholder="Enter password">',
                    confirmButtonText: 'Access',
                    showCancelButton: true,
                    preConfirm: async () => {
                        const password = document.getElementById('access-password').value;
                        try {
                            console.log('Attempting direct access');
                            const response = await fetch(`${BASE_API_URL}/api/admin-login`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ password })
                            });
                            const result = await response.json();
                            console.log('Direct access response:', result);
                            if (result.success) {
                                return true;
                            } else {
                                Swal.showValidationMessage(result.error || 'Wrong password!');
                                return false;
                            }
                        } catch (error) {
                            console.error('Direct access fetch error:', error);
                            Swal.showValidationMessage('Server error');
                            return false;
                        }
                    }
                }).then((result) => {
                    if (result.isConfirmed) {
                        localStorage.setItem('directAccess', 'success');
                        localStorage.setItem('directAccess_expiration', Date.now() + 365 * 24 * 60 * 60 * 1000);
                        localStorage.setItem('isAdmin', 'true');
                        Swal.fire('Success!', 'Access granted. Redirecting to home page...', 'success');
                        setTimeout(() => window.location.href = './home.html', 1000);
                    }
                });
            } catch (error) {
                console.error('Direct access error:', error);
                Swal.fire('Error!', 'Access failed!', 'error');
            }
        }
    </script>
</head>

    <main>

            <p>Get secure access for 24 or 48 hours! ✨</p>
            <div class="flex-col-gap-3">

    <footer class="footer-section">

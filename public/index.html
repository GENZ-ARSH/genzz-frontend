    <script>
        const BASE_API_URL = 'https://genzz-backend.onrender.com';
        const HOME_URL = '/home.html';
        const ADMIN_PASSWORD = 'mango'; // Hardcoded for simplicity
        const clickSound = new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA');
        clickSound.volume = 0.3;

        document.addEventListener('DOMContentLoaded', function () {
            // Apply dark mode
            const darkModeEnabled = localStorage.getItem('darkMode') === 'enabled';
            if (darkModeEnabled) {
                document.body.classList.add('dark-mode');
                document.getElementById('darkModeToggle').checked = true;
            }
            document.getElementById('darkModeToggle').addEventListener('change', function () {
                try {
                    clickSound.play();
                    if (this.checked) {
                        document.body.classList.add('dark-mode');
                        localStorage.setItem('darkMode', 'enabled');
                    } else {
                        document.body.classList.remove('dark-mode');
                        localStorage.setItem('darkMode', 'disabled');
                    }
                } catch (error) {
                    console.error('Dark mode toggle error:', error);
                    Swal.fire('Error!', 'Failed to toggle dark mode.', 'error');
                }
            });

            // Add click sound to footer links
            document.querySelectorAll('.footer-links a').forEach(link => {
                link.addEventListener('click', () => clickSound.play());
            });

            // Triple-click footer for password prompt
            let clickCount = 0;
            let clickTimer = null;
            document.getElementById('footer').addEventListener('click', function () {
                clickCount++;
                if (clickCount === 1) {
                    clickTimer = setTimeout(() => {
                        clickCount = 0; // Reset if not triple-clicked within 1 second
                    }, 1000);
                }
                if (clickCount === 3) {
                    clearTimeout(clickTimer);
                    clickCount = 0;
                    clickSound.play();

                    Swal.fire({
                        title: 'Kya Haal Hai Ladle! 😜',
                        html: `<input type="password" id="admin-password" class="swal2-input" placeholder="Pass Dal, Bhai!">`,
                        confirmButtonText: 'Access Karo, Boss!',
                        showCancelButton: true,
                        cancelButtonText: 'Nahi, Chhod Do',
                        backdrop: `
                            rgba(0,0,123,0.4)
                            url("https://sweetalert2.github.io/images/nyan-cat.gif")
                            left top
                            no-repeat
                        `,
                        customClass: {
                            popup: 'animated bounceIn',
                            confirmButton: 'btn-access'
                        },
                        preConfirm: () => {
                            const password = document.getElementById('admin-password').value;
                            if (!password) {
                                Swal.showValidationMessage('Password toh daal, ladle!');
                                return false;
                            }
                            if (password === ADMIN_PASSWORD) {
                                return true;
                            } else {
                                Swal.showValidationMessage('Galat password, bhai!');
                                return false;
                            }
                        }
                    }).then(result => {
                        if (result.isConfirmed) {
                            clickSound.play();
                            localStorage.setItem('directAccess', 'success');
                            Swal.fire({
                                title: 'Access Mil Gaya! 😎',
                                text: 'Ab home page pe jaa raha hai!',
                                icon: 'success',
                                timer: 2000,
                                showConfirmButton: false
                            }).then(() => {
                                window.location.href = './home.html';
                            });
                        }
                    });
                }
            });
        });

        // Sanitize input
        function sanitizeInput(input) {
            const div = document.createElement('div');
            div.textContent = input;
            return div.innerHTML;
        }

        // Fetch CSRF token
        async function getCsrfToken() {
            try {
                const response = await fetch(`${BASE_API_URL}/api/csrf-token`, {
                    method: 'GET',
                    credentials: 'include'
                });
                const data = await response.json();
                return data.csrfToken;
            } catch (error) {
                console.error('Error fetching CSRF token:', error);
                return null;
            }
        }

        async function generateKey(duration) {
            try {
                clickSound.play();
                Swal.fire({
                    title: 'Generating Key 🔑',
                    text: 'Please wait...',
                    allowOutsideClick: false,
                    didOpen: () => {
                        Swal.showLoading();
                    }
                });

                const csrfToken = await getCsrfToken();
                if (!csrfToken) {
                    throw new Error('Failed to fetch CSRF token');
                }

                const response = await fetch(`${BASE_API_URL}/api/generate-key`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': csrfToken
                    },
                    body: JSON.stringify({
                        duration,
                        userId: uuidv4(),
                        url: HOME_URL
                    }),
                    credentials: 'include'
                });

                const result = await response.json();
                if (!response.ok || result.error) {
                    throw new Error(result.error || `HTTP ${response.status}: Failed to generate key`);
                }

                Swal.close();
                window.location.href = result.shortUrl;
            } catch (error) {
                console.error('Key generation error:', error.message);
                Swal.fire('Error!', `Failed to generate key: ${error.message}. Please try again.`, 'error');
            }
        }

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenZZ Library - Validating Access</title>
    <link rel="icon" href="./assets/favicon.ico">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #bfdbfe, #60a5fa);
            font-family: 'Inter', sans-serif;
        }
        .header-section {
            padding-top: 1rem;
            padding-bottom: 1rem;
        }
        .container {
            max-width: 1280px;
            margin-left: auto;
            margin-right: auto;
            padding-left: 1rem;
            padding-right: 1rem;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo-container {
            display: inline-block;
        }
        .flex-space-x-4 {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        main {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 1.25rem;
            padding-bottom: 1.25rem;
        }
        .validation-card {
            padding: 1.5rem;
            margin-left: 1rem;
            margin-right: 1rem;
            width: 100%;
            max-width: 28rem;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 25px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }
        .validation-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.25);
        }
        h2 {
            font-size: 1.5rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 1rem;
            font-family: 'Poppins', sans-serif;
        }
        p {
            color: #4b5563;
            text-align: center;
            margin-bottom: 1rem;
        }
        .btn-access {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            padding: 0.9rem 2.8rem;
            background: linear-gradient(90deg, #facc15, #f97316);
            color: #1e40af;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3);
            text-decoration: none;
        }
        .btn-access:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 20px rgba(249, 115, 22, 0.5);
            background: linear-gradient(90deg, #eab308, #ea580c);
        }
        .btn-access::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.5s ease, height 0.5s ease;
        }
        .btn-access:hover::before {
            width: 350px;
            height: 350px;
        }
        .btn-access.text-sm {
            font-size: 0.875rem;
            padding: 0.5rem 1rem;
        }
        .relative {
            position: relative;
        }
        .inline-flex {
            display: inline-flex;
            align-items: center;
            cursor: pointer;
        }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
        .rounded-full {
            border-radius: 9999px;
        }
        .peer:checked ~ .bg-blue-600 {
            background-color: #2563eb;
        }
        .transition-colors {
            transition: background-color 0.2s ease;
        }
        .w-11 {
            width: 2.75rem;
        }
        .h-6 {
            height: 1.5rem;
        }
        .bg-gray-200 {
            background-color: #e5e7eb;
        }
        .absolute {
            position: absolute;
        }
        .left-1 {
            left: 0.25rem;
        }
        .top-1 {
            top: 0.25rem;
        }
        .w-4 {
            width: 1rem;
        }
        .h-4 {
            height: 1rem;
        }
        .bg-white {
            background-color: #ffffff;
        }
        .transition-transform {
            transition: transform 0.2s ease;
        }
        .peer:checked ~ .translate-x-5 {
            transform: translateX(1.25rem);
        }
        .text-xs {
            font-size: 0.75rem;
        }
        .peer-checked\:hidden {
            display: none;
        }
        .peer-checked\:block {
            display: block;
        }
        .footer-section {
            padding-top: 1rem;
            padding-bottom: 1rem;
        }
        .mb-0 {
            margin-bottom: 0;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #f97316;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .dark-mode {
            background: linear-gradient(135deg, #1e3a8a, #1e40af);
            color: #ffffff;
        }
        .dark-mode .validation-card {
            background: rgba(30, 30, 30, 0.98);
            color: #ffffff;
        }
        .dark-mode .header-section {
            background: rgba(30, 30, 30, 0.95);
        }
        .dark-mode .footer-section {
            background: rgba(255, 255, 255, 0.05);
        }
        .made-with-heart {
            font-family: 'Poppins', sans-serif;
            color: #1e40af;
            transition: color 0.3s ease;
        }
        .dark-mode .made-with-heart {
            color: #f97316;
        }
        .made-with-heart:hover {
            color: #f97316;
        }
    </style>
    <script>
        const BASE_API_URL = 'https://genzz-backend.onrender.com';
        const clickSound = new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA');
        clickSound.volume = 0.3;

        document.addEventListener('DOMContentLoaded', async function () {
            const darkModeEnabled = localStorage.getItem('darkMode') === 'enabled';
            if (darkModeEnabled) {
                document.body.classList.add('dark-mode');
                document.getElementById('darkModeToggle').checked = true;
            }
            document.getElementById('darkModeToggle').addEventListener('change', function () {
                try {
                    if (this.checked) {
                        document.body.classList.add('dark-mode');
                        localStorage.setItem('darkMode', 'enabled');
                    } else {
                        document.body.classList.remove('dark-mode');
                        localStorage.setItem('darkMode', 'disabled');
                    }
                } catch (error) {
                    console.error('Dark mode error:', error);
                    Swal.fire('Error!', 'Failed to toggle dark mode.', 'error');
                }
            });

            try {
                const isAdmin = localStorage.getItem('isAdmin') === 'true';
                if (isAdmin) {
                    clickSound.play();
                    Swal.fire({
                        title: 'Admin Access Granted! 🎉',
                        text: 'Redirecting to library...',
                        icon: 'success',
                        timer: 2000,
                        showConfirmButton: false
                    }).then(() => {
                        localStorage.setItem('pdflogin', 'success');
                        localStorage.setItem('pdflogin_expiration', Date.now() + 365 * 24 * 60 * 60 * 1000);
                        window.location.href = './home.html';
                    });
                    return;
                }

                const token = localStorage.getItem('accessToken');
                const expiry = localStorage.getItem('accessTokenExpiry');
                const shortUrl = localStorage.getItem('shortUrl');

                if (!token || !expiry || Date.now() > parseInt(expiry)) {
                    throw new Error('Invalid or expired token');
                }

                const response = await fetch(`${BASE_API_URL}/api/validate-key`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    credentials: 'include'
                });
                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(result.error || 'Token validation failed');
                }

                clickSound.play();
                Swal.fire({
                    title: 'Access Validated! 🎉',
                    text: 'Redirecting to library...',
                    icon: 'success',
                    timer: 2000,
                    showConfirmButton: false
                }).then(() => {
                    localStorage.setItem('pdflogin', 'success');
                    localStorage.setItem('pdflogin_expiration', result.expiry);
                    window.location.href = './home.html';
                });
            } catch (error) {
                console.error('Error validating key:', error);
                Swal.fire({
                    title: 'Access Denied',
                    text: 'Your access key is invalid or expired. Generate a new key.',
                    icon: 'error',
                    confirmButtonText: 'Go to Key Generator'
                }).then(() => {
                    localStorage.removeItem('accessToken');
                    localStorage.removeItem('accessTokenExpiry');
                    localStorage.removeItem('shortUrl');
                    localStorage.removeItem('pdflogin');
                    localStorage.removeItem('pdflogin_expiration');
                    window.location.href = './index.html';
                });
            }
        });
    </script>
</head>
<body>
    <header class="header-section">
        <div class="container">
            <nav>
                <div class="logo-container">
                    <svg width="160" height="60" viewBox="0 0 160 60" xmlns="http://www.w3.org/2000/svg" class="main-logo">
                        <g class="books-logo">
                            <path d="M36 46H16V14C16 12.9 16.9 12 18 12H34C35.1 12 36 12.9 36 13V46Z" fill="none" stroke="currentColor" stroke-width="2" />
                            <path d="M36 46H19V18C19 16.9 19.9 16 21 16H34C35.1 16 36 16.9 36 18V46Z" fill="none" stroke="currentColor" stroke-width="2" />
                            <path d="M19 46H40V22C40 20.9 40.9 20 42 20H54C55.1 20 56 20.9 56 22V42C56 44.2 54.2 46 52 46H19Z" fill="none" stroke="currentColor" stroke-width="2" />
                            <line x1="24" y1="20" x2="31" y2="20" stroke="currentColor" stroke-width="2" />
                            <line x1="24" y1="24" x2="31" y2="24" stroke="currentColor" stroke-width="2" />
                            <line x1="24" y1="28" x2="31" y2="28" stroke="currentColor" stroke-width="2" />
                            <line x1="44" y1="26" x2="51" y2="26" stroke="currentColor" stroke-width="2" />
                            <line x1="44" y1="30" x2="51" y2="30" stroke="currentColor" stroke-width="2" />
                            <line x1="44" y1="34" x2="51" y2="34" stroke="currentColor" stroke-width="2" />
                            <line x1="15" y1="46" x2="60" y2="46" stroke="currentColor" stroke-width="2" />
                        </g>
                        <text x="70" y="30" font-family="Poppins, sans-serif" font-size="16" font-weight="600" fill="currentColor">GEN-Z</text>
                        <text x="70" y="42" font-family="Inter, sans-serif" font-size="11" fill="currentColor">PDF Library</text>
                    </svg>
                </div>
                <div class="flex-space-x-4">
                    <a href="https://t.me/genzcoders1" class="btn-access text-sm" target="_blank" rel="noopener noreferrer">
                        <i class="bi bi-chat-dots-fill mr-1"></i> Join Gen-Z Channel 🚀
                    </a>
                    <label class="relative inline-flex">
                        <input type="checkbox" id="darkModeToggle" class="sr-only peer">
                        <div class="w-11 h-6 bg-gray-200 rounded-full peer transition-colors">
                            <span class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-transform peer-checked:translate-x-5 flex items-center justify-center text-xs">
                                <i id="lightIcon" class="bi bi-brightness-high peer-checked:hidden"></i>
                                <i id="darkIcon" class="bi bi-moon-stars-fill hidden peer-checked:block"></i>
                            </span>
                        </div>
                    </label>
                </div>
            </nav>
        </div>
    </header>
    <main>
        <div class="validation-card">
            <h2>Validating Your Access 🔑</h2>
            <p>Please wait while we verify your key...</p>
            <div class="loader"></div>
            <div class="mt-6 flex justify-center">
                <a href="./index.html" class="btn-access">
                    <i class="bi bi-arrow-left-circle mr-2"></i> Back to Key Generator
                </a>
            </div>
        </div>
    </main>
    <footer class="footer-section">
        <div class="container">
            <p class="made-with-heart mb-0">Made with ❤️ by GenZ-Coders</p>
        </div>
    </footer>
</body>
</html>
